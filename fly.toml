# Fly.io deployment config. `fly launch` generates/uses this; adjust
# `app` and `primary_region` to your account. DATABASE_URL is NOT set
# here — provide it as a secret: `fly secrets set DATABASE_URL=...`.
app = "football-league-simulator"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Liveness check — /health reports only that the process is up (no DB),
  # so a transient DB blip doesn't flap the machine. The app applies
  # migrations and opens the pool at boot before this passes.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
